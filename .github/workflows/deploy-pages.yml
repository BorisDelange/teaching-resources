# Miroir de secours du site, sur GitHub Pages (le site principal est sur
# Frama.io, voir .gitlab-ci.yml).
#
# A activer une fois dans le depot : Settings > Pages > Source = GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GitHub Pages sert le projet sous /<depot>/, et non a la racine comme
      # Frama.io. `build:client` : Pages ne sert que des fichiers statiques.
      - run: npm run build:client
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Fallback SPA : les routes profondes (/courses/...) n'existent pas sur
      # le disque, et GitHub Pages repond alors avec 404.html.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
